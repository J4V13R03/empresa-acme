<div class="card-body">
    <h4 class="card-title border-bottom">Top 5 Productos - Mejor Ranking</h4>
    <ngx-charts-bar-horizontal
        [view]="[1000,400]"
        [results]="saleData()"
        [xAxisLabel]="'Rating'"
        [yAxisLabel]="'Productos'"
        [legend]="false"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        [xAxis]="true"
        [yAxis]="true"
        [gradient]="false"
        [scheme]="colorScheme"
    >
    </ngx-charts-bar-horizontal>
</div>
