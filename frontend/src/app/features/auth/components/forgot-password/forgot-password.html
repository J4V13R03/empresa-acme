<div class="recovery-container">
  <div class="recovery-card">
    <!-- Among Us Character -->
    <div class="crewmate">
      <img src="amogus.png" alt="Among Us Crewmate" width="120" height="120">
    </div>

    <h1 class="emergency-text">🚨 EMERGENCY MEETING</h1>
    <p class="subtitle">Reportá una emergencia para recuperar tu acceso</p>

    @if (!sent()) {
      <form [formGroup]="forgotForm" (ngSubmit)="sendRecovery()" class="recovery-form">
        <div class="input-group-custom">
          <i class="bi bi-envelope-fill"></i>
          <input formControlName="email" type="email" placeholder="Tu email de tripulante" autocomplete="off">
        </div>

        @if (error()) {
          <p class="error-text">{{ error() }}</p>
        }

        <button type="submit" class="btn-emergency" [disabled]="forgotForm.invalid || loading()">
          @if (loading()) {
            <span class="spinner"></span> Enviando...
          } @else {
            📨 Enviar Instrucciones
          }
        </button>
      </form>
    } @else {
      <div class="success-box">
        <div class="success-icon">✉️</div>
        <p>Revisá tu casilla de correo</p>
        <p class="small">Te enviamos un link para completar las tareas y recuperar tu contraseña</p>
      </div>
    }

    <a routerLink="/login" class="back-link">← Volver al inicio de sesión</a>
  </div>
</div>
