<div class="reset-container">
  <div class="stars"></div>

  <div class="reset-card">
    <div class="crewmate-small">
      <img src="amogus.png" alt="Among Us Crewmate" width="80" height="80">
    </div>

    <h1 class="reset-title">🔐 NUEVA CONTRASEÑA</h1>
    <p class="subtitle">Ingresá el código que obtuviste y tu nueva contraseña</p>

    @if (!success()) {
      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="reset-form">
        <div class="input-group-custom">
          <i class="bi bi-key-fill"></i>
          <input formControlName="code" type="text" placeholder="Código de 6 dígitos"
                 maxlength="6" autocomplete="off" class="code-input">
        </div>

        <div class="input-group-custom">
          <i class="bi bi-lock-fill"></i>
          <input formControlName="newPassword" type="password" placeholder="Nueva contraseña"
                 autocomplete="new-password">
        </div>

        <div class="input-group-custom">
          <i class="bi bi-lock-fill"></i>
          <input formControlName="confirmPassword" type="password" placeholder="Confirmar contraseña"
                 autocomplete="new-password">
        </div>

        @if (error()) {
          <p class="error-text">{{ error() }}</p>
        }

        <button type="submit" class="btn-reset" [disabled]="resetForm.invalid || loading()">
          @if (loading()) {
            <span class="spinner"></span> Guardando...
          } @else {
            🔑 Cambiar Contraseña
          }
        </button>
      </form>
    } @else {
      <div class="success-box">
        <div class="success-icon">✅</div>
        <p class="success-title">¡Contraseña actualizada!</p>
        <p class="success-sub">Ya podés iniciar sesión con tu nueva contraseña</p>
        <button class="btn-go-login" (click)="goToLogin()">➡ Ir al inicio de sesión</button>
      </div>
    }

    <a routerLink="/login" class="back-link">← Volver al inicio de sesión</a>
  </div>
</div>
